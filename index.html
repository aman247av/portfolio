    <link rel="me" href="https://github.com/aman247av" />
    <link rel="me" href="https://www.linkedin.com/in/aman247av/" />

    <!-- Self-hosted variable fonts, preloaded so they land before first paint.
         Both are needed above the fold: the h1 is JetBrains Mono (it is the LCP
         element) and the hero prose is Inter. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-var.woff2"
      crossorigin
    />

    <!-- Generated from src/content by scripts/prerender.mjs at build time, so
         the markup cannot disagree with the page. Empty in dev; crawlers only
         ever see the production build. -->
    <!--structured-data-->

    <!-- Cloudflare Web Analytics, injected by scripts/prerender.mjs so it only
         ships in production builds. Cloudflare rejects any origin other than
         the registered one, so on localhost the beacon throws a CORS error and
         buries real errors in the dev console. No cookies, so no consent banner
         is needed. This is the page's only third-party request. -->
    <!--analytics-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
